<!doctype html>
<!-- Chordy app icon. Source of truth for Resources/AppIcon.icns: regenerate with scripts/make-icon.sh.
     A white piano keyboard on the brand squircle; three keys of a triad glow, the chord being played. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Chordy icon</title>
<style>
html, body { margin: 0; background: transparent; }
.icon { width: 1024px; height: 1024px; position: relative; }
.squircle { position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; border-radius: 185px;
  background: linear-gradient(160deg, #4A7BF0 0%, #3566E0 55%, #2A52B8 100%);
  overflow: hidden; box-shadow: 0 18px 36px rgba(0,0,0,0.32); }
svg { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div class="icon">
  <div class="squircle">
    <svg width="824" height="824" viewBox="0 0 824 824" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
          <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#08102E" flood-opacity="0.38"/>
        </filter>
        <clipPath id="body"><rect x="142" y="232" width="540" height="400" rx="56"/></clipPath>
      </defs>
      <!-- Keyboard body. -->
      <g filter="url(#shadow)">
        <rect x="142" y="232" width="540" height="400" rx="56" fill="#FFFFFF"/>
      </g>
      <g clip-path="url(#body)">
        <!-- Five white keys separated by gaps; keys 1, 3 and 5 sound (C–E–G). -->
        <rect x="142" y="232" width="540" height="400" fill="#FFFFFF"/>
        <rect x="142" y="232" width="108" height="400" fill="#DCE6FF"/>
        <rect x="358" y="232" width="108" height="400" fill="#DCE6FF"/>
        <rect x="574" y="232" width="108" height="400" fill="#DCE6FF"/>
        <g fill="#B9C9F2">
          <rect x="248" y="232" width="4" height="400"/>
          <rect x="356" y="232" width="4" height="400"/>
          <rect x="464" y="232" width="4" height="400"/>
          <rect x="572" y="232" width="4" height="400"/>
        </g>
        <!-- Black keys. -->
        <g fill="#1F3E94">
          <rect x="214" y="232" width="72" height="232" rx="14"/>
          <rect x="322" y="232" width="72" height="232" rx="14"/>
          <rect x="538" y="232" width="72" height="232" rx="14"/>
        </g>
        <!-- Chord dots on the sounding keys. -->
        <g fill="#3566E0">
          <circle cx="196" cy="560" r="30"/>
          <circle cx="412" cy="560" r="30"/>
          <circle cx="628" cy="560" r="30"/>
        </g>
      </g>
    </svg>
  </div>
</div>
</body>
</html>

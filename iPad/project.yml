name: ChordyPads
options:
  bundleIdPrefix: com.egluu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 3HWTS4AVPU
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ChordyPads:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: ../Sources/Chordy/RemoteProtocol.swift
      - path: ../Sources/Chordy/Patch.swift
      - path: ../Sources/Chordy/ChordSheet.swift
      - path: ../Sources/Chordy/ChordSheetView.swift
      - path: ../Sources/Chordy/MidiScore.swift
      - path: ../Sources/Chordy/PianoRollView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.egluu.chordypads
        PRODUCT_NAME: Chordy Pads
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chordy Pads
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Chordy Pads busca y controla Chordy en tu Mac por la red local."
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    info:
      path: Resources/Info.plist
      properties:
        NSBonjourServices: ["_chordypads._tcp"]
        NSLocalNetworkUsageDescription: "Chordy Pads busca y controla Chordy en tu Mac por la red local."
        UILaunchScreen: {}
        CFBundleDisplayName: Chordy Pads
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
